<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generador y Calibrador FOS - Azubiform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js para renderizar la vista previa -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- PDF-Lib para generar el PDF final -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        .draggable-box {
            touch-action: none;
            user-select: none;
            resize: both;
            overflow: auto;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-3 sm:p-6">

    <div class="max-w-7xl mx-auto space-y-4">
        <!-- Cabecera -->
        <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3">
            <h1 class="text-xs sm:text-sm font-bold text-indigo-900 uppercase">⚡ Generador y Calibrador de Coordenadas FOS</h1>
            <div class="w-full sm:w-auto">
                <input type="file" id="pdfFile" accept="application/pdf" class="text-[11px] text-gray-500 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[11px] file:font-semibold file:bg-indigo-50 file:text-indigo-700 w-full">
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <!-- Panel Izquierdo: Lienzo Interactivo -->
            <div class="lg:col-span-2 bg-gray-900 rounded-xl p-2 sm:p-4 flex justify-center overflow-auto max-h-[70vh] lg:max-h-[800px] relative border border-gray-300">
                <div class="relative inline-block shadow-2xl" id="canvasContainer">
                    <canvas id="pdfCanvas" class="block"></canvas>
                    <div id="drawingOverlay" class="absolute inset-0 pointer-events-none"></div>
                </div>
            </div>

            <!-- Panel Derecho: Controles y Calibración -->
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm space-y-3 flex flex-col justify-between">
                <div class="space-y-3">
                    <h2 class="text-xs font-bold text-gray-800 uppercase border-b pb-2">Controles y Calibración</h2>
                    
                    <!-- 1. Plantilla -->
                    <div class="bg-indigo-50 p-2.5 rounded-lg border border-indigo-200 space-y-1">
                        <label class="text-[10px] font-semibold text-indigo-900">📂 1. Seleccionar escuela:</label>
                        <select id="selectPlantillasGuardadas" class="w-full p-1.5 border border-indigo-300 rounded text-xs bg-white font-medium">
                            <option value="">-- Selecciona escuela --</option>
                        </select>
                    </div>

                    <!-- 2. Usuario y Semana -->
                    <div class="bg-emerald-50 p-2.5 rounded-lg border border-emerald-200 space-y-2">
                        <div>
                            <label class="text-[10px] font-semibold text-emerald-900">👤 2. Seleccionar usuario:</label>
                            <select id="selectUsuario" class="w-full p-1.5 border border-emerald-300 rounded text-xs bg-white font-medium">
                                <option value="">-- Selecciona usuario --</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-semibold text-emerald-900">📅 3. Seleccionar semana:</label>
                            <select id="selectSemana" class="w-full p-1.5 border border-emerald-300 rounded text-xs bg-white font-medium">
                                <option value="">-- Carga usuario primero --</option>
                            </select>
                        </div>
                    </div>

                    <!-- Herramienta de Calibración Global y Manual -->
                    <div class="bg-amber-50 p-2.5 rounded-lg border border-amber-200 space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-bold text-amber-900">🛠️ Modo Calibración Manual:</span>
                            <button id="btnActivarEdicion" class="bg-amber-600 hover:bg-amber-700 text-white text-[10px] px-2 py-1 rounded font-bold">Activar Edición</button>
                        </div>
                        <p class="text-[9px] text-amber-800">Arrastra cajas de forma individual o desplázalas todas juntas abajo:</p>
                        
                        <!-- Opción para desplazar todas las coordenadas hacia abajo -->
                        <div class="flex space-x-1 pt-1">
                            <input type="number" id="inputDesplazarY" value="30" class="w-20 p-1 text-xs border rounded bg-white text-center" placeholder="Píxeles">
                            <button id="btnDesplazarTodoAbajo" class="w-full bg-amber-700 hover:bg-amber-800 text-white text-[10px] font-bold py-1 rounded">⬇️ Mover Todo Abajo</button>
                        </div>

                        <!-- Botón de guardado -->
                        <button id="btnGuardarCoordenadas" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white text-[10px] font-bold py-2 rounded shadow hidden">💾 Guardar Cambios en Supabase</button>
                    </div>

                    <button id="btnActualizarVista" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white text-xs font-bold py-2 rounded shadow transition">
                        👁️ Actualizar Vista Previa
                    </button>
                </div>

                <!-- Botón Final de Descarga -->
                <div class="space-y-2 pt-2 border-t">
                    <button id="btnGenerarPDFDirecto" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 rounded-lg shadow transition uppercase tracking-wide">
                        🚀 Descargar PDF Definitivo
                    </button>
                    <div id="estadoInfo" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 p-2 rounded border border-indigo-200 text-center">
                        📌 Listo para operar.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { SUPABASE_URL, headers } from './js/config.js';

        const fileInput = document.getElementById('pdfFile');
        const canvas = document.getElementById('pdfCanvas');
        const drawingOverlay = document.getElementById('drawingOverlay');
        const selectPlantillasGuardadas = document.getElementById('selectPlantillasGuardadas');
        const selectUsuario = document.getElementById('selectUsuario');
        const selectSemana = document.getElementById('selectSemana');
        const btnActualizarVista = document.getElementById('btnActualizarVista');
        const btnActivarEdicion = document.getElementById('btnActivarEdicion');
        const btnDesplazarTodoAbajo = document.getElementById('btnDesplazarTodoAbajo');
        const inputDesplazarY = document.getElementById('inputDesplazarY');
        const btnGuardarCoordenadas = document.getElementById('btnGuardarCoordenadas');
        const btnGenerarPDFDirecto = document.getElementById('btnGenerarPDFDirecto');
        const estadoInfo = document.getElementById('estadoInfo');

        let pdfDoc = null;
        let pageViewport = null;
        let scale = 1.2;
        let archivoPdfOriginalBytes = null;
        let coordenadasMap = {};
        let semanasAgrupadas = {};
        let registrosGlobales = [];
        let modoEdicionActivo = false;
        let escuelaSeleccionadaId = null;

        async function cargarListaPlantillas() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/school_templates?select=school_name,file_identifier`, {
                    headers: { ...headers, 'Range': '0-999' }
                });
                if (response.ok) {
                    const data = await response.json();
                    selectPlantillasGuardadas.innerHTML = '<option value="">-- Selecciona escuela --</option>';
                    data.forEach(item => {
                        const opt = document.createElement('option');
                        opt.value = item.file_identifier;
                        opt.textContent = item.school_name;
                        selectPlantillasGuardadas.appendChild(opt);
                    });
                }
            } catch (err) { console.error(err); }
        }

        async function cargarListaUsuarios() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/usuarios?select=id,nombre`, {
                    headers: { ...headers, 'Range': '0-999' }
                });
                if (response.ok) {
                    const data = await response.json();
                    selectUsuario.innerHTML = '<option value="">-- Selecciona usuario --</option>';
                    data.forEach(item => {
                        const opt = document.createElement('option');
                        opt.value = item.nombre;
                        opt.textContent = item.nombre;
                        selectUsuario.appendChild(opt);
                    });
                }
            } catch (err) { console.error(err); }
        }

        cargarListaPlantillas();
        cargarListaUsuarios();

        selectPlantillasGuardadas.addEventListener('change', async (e) => {
            escuelaSeleccionadaId = e.target.value;
            if (!escuelaSeleccionadaId) return;

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/school_templates?file_identifier=eq.${encodeURIComponent(escuelaSeleccionadaId)}&select=coordinates_json`, {
                    headers: { ...headers, 'Range': '0-999' }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data.length > 0 && data[0].coordinates_json) {
                        coordenadasMap = data[0].coordinates_json;
                        if (pdfDoc) redibujarOverlay();
                        estadoInfo.textContent = "✅ Coordenadas aplicadas.";
                    }
                }
            } catch (err) { console.error(err); }
        });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            archivoPdfOriginalBytes = await file.arrayBuffer();

            const loadingTask = pdfjsLib.getDocument({ data: archivoPdfOriginalBytes });
            pdfDoc = await loadingTask.promise;
            await renderPage(1);
            estadoInfo.textContent = "✅ PDF base cargado.";
        });

        async function renderPage(num) {
            const page = await pdfDoc.getPage(num);
            pageViewport = page.getViewport({ scale });

            const context = canvas.getContext('2d');
            canvas.height = pageViewport.height;
            canvas.width = pageViewport.width;

            await page.render({ canvasContext: context, viewport: pageViewport }).promise;
            redibujarOverlay();
        }

        selectUsuario.addEventListener('change', async (e) => {
            const nombreUsuario = e.target.value;
            if (!nombreUsuario) return;

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/registro_diario?usuario=eq.${encodeURIComponent(nombreUsuario)}&select=*`, {
                    headers: { ...headers, 'Range': '0-999' }
                });
                if (response.ok) {
                    registrosGlobales = await response.json();
                    semanasAgrupadas = agruparRegistrosPorSemana(registrosGlobales);

                    selectSemana.innerHTML = '<option value="">-- Selecciona una semana --</option>';
                    Object.keys(semanasAgrupadas).forEach(sem => {
                        const opt = document.createElement('option');
                        opt.value = sem;
                        opt.textContent = `Woche: ${sem}`;
                        selectSemana.appendChild(opt);
                    });
                    estadoInfo.textContent = `✅ Registros cargados para ${nombreUsuario}`;
                }
            } catch (err) { console.error(err); }
        });

        selectSemana.addEventListener('change', () => {
            if (pdfDoc) redibujarOverlay();
        });

        function agruparRegistrosPorSemana(registros) {
            const semanas = {};
            registros.forEach(reg => {
                if (!reg.fecha) return;
                const fechaObj = new Date(reg.fecha);
                const diaSemana = fechaObj.getDay();
                const diff = fechaObj.getDate() - diaSemana + (diaSemana === 0 ? -6 : 1);
                const lunes = new Date(new Date(fechaObj).setDate(diff));
                const viernes = new Date(lunes);
                viernes.setDate(lunes.getDate() + 4);

                const claveSemana = `${lunes.toLocaleDateString()} bis ${viernes.toLocaleDateString()}`;

                if (!semanas[claveSemana]) {
                    semanas[claveSemana] = { lunes: [], dienstag: [], mittwoch: [], donnerstag: [], freitag: [] };
                }

                const d = new Date(reg.fecha).getDay();
                const texto = reg.nombre_actividad || '';

                if (d === 1) semanas[claveSemana].lunes.push(texto);
                else if (d === 2) semanas[claveSemana].dienstag.push(texto);
                else if (d === 3) semanas[claveSemana].mittwoch.push(texto);
                else if (d === 4) semanas[claveSemana].donnerstag.push(texto);
                else if (d === 5) semanas[claveSemana].freitag.push(texto);
            });
            return semanas;
        }

        btnActualizarVista.addEventListener('click', () => {
            if (!pdfDoc) return;
            redibujarOverlay();
            estadoInfo.textContent = "👁️ Vista actualizada.";
        });

        btnActivarEdicion.addEventListener('click', () => {
            modoEdicionActivo = !modoEdicionActivo;
            btnActivarEdicion.textContent = modoEdicionActivo ? "❌ Salir de Edición" : "Activar Edición";
            btnActivarEdicion.className = modoEdicionActivo ? "bg-red-600 hover:bg-red-700 text-white text-[10px] px-2 py-1 rounded font-bold" : "bg-amber-600 hover:bg-amber-700 text-white text-[10px] px-2 py-1 rounded font-bold";
            btnGuardarCoordenadas.classList.toggle('hidden', !modoEdicionActivo);
            redibujarOverlay();
        });

        btnDesplazarTodoAbajo.addEventListener('click', () => {
            if (Object.keys(coordenadasMap).length === 0) return alert("⚠️ No hay coordenadas cargadas.");
            const offset = parseFloat(inputDesplazarY.value) || 30;

            for (const campo in coordenadasMap) {
                const box = coordenadasMap[campo];
                box.y1 -= offset;
                box.y2 -= offset;
            }

            redibujarOverlay();
            btnGuardarCoordenadas.classList.remove('hidden');
            estadoInfo.textContent = `⬇️ Coordenadas desplazadas ${offset}px. ¡Guarda los cambios!`;
        });

        function redibujarOverlay() {
            if (!pageViewport) return;
            drawingOverlay.innerHTML = '';

            const semSeleccionada = selectSemana.value;
            const datosSemana = semanasAgrupadas[semSeleccionada] || {};
            const nombreUsuario = selectUsuario.value || "Ejemplo Usuario";

            for (const [campo, box] of Object.entries(coordenadasMap)) {
                if (!box || typeof box.x1 === 'undefined') continue;

                const left = box.x1 * scale;
                const top = pageViewport.height - (box.y2 * scale);
                const width = (box.x2 - box.x1) * scale;
                const height = (box.y2 - box.y1) * scale;

                const cajaVisual = document.createElement('div');
                cajaVisual.className = `absolute overflow-hidden px-1 font-sans text-black z-10 ${modoEdicionActivo ? 'border-2 border-red-500 bg-red-100/70 draggable-box cursor-move pointer-events-auto shadow-md resize' : 'border border-blue-400/30 bg-blue-50/20 pointer-events-none'}`;
                cajaVisual.style.left = `${left}px`;
                cajaVisual.style.top = `${top}px`;
                cajaVisual.style.width = `${width}px`;
                cajaVisual.style.height = `${height}px`;

                const lowerKey = campo.toLowerCase();
                let textoAsignado = '';

                if (!lowerKey.includes('stunden') && !lowerKey.includes('hora') && !lowerKey.includes('zeit')) {
                    if (lowerKey.includes('montag') || lowerKey.includes('lunes')) textoAsignado = (datosSemana.lunes || []).join('<br>');
                    else if (lowerKey.includes('dienstag') || lowerKey.includes('martes')) textoAsignado = (datosSemana.dienstag || []).join('<br>');
                    else if (lowerKey.includes('mittwoch') || lowerKey.includes('miercoles')) textoAsignado = (datosSemana.mittwoch || []).join('<br>');
                    else if (lowerKey.includes('donnerstag') || lowerKey.includes('jueves')) textoAsignado = (datosSemana.donnerstag || []).join('<br>');
                    else if (lowerKey.includes('freitag') || lowerKey.includes('viernes')) textoAsignado = (datosSemana.freitag || []).join('<br>');
                    else if (lowerKey.includes('schueler')) textoAsignado = nombreUsuario;
                }

                // Si está vacío, se muestra limpio en la vista previa
                const contenidoVisual = textoAsignado ? textoAsignado : `<span class="text-gray-400 italic">(Vacío)</span>`;
                cajaVisual.innerHTML = `<span class="text-[6px] font-bold text-red-900 block mb-0.5 sticky top-0 bg-red-100/90 px-0.5">${campo}</span><div class="pointer-events-none text-[5px] leading-tight">${contenidoVisual}</div>`;

                if (modoEdicionActivo) {
                    let isDragging = false;
                    let startX, startY, initialLeft, initialTop;

                    cajaVisual.addEventListener('pointerdown', (e) => {
                        if (e.offsetX > cajaVisual.offsetWidth - 15 && e.offsetY > cajaVisual.offsetHeight - 15) return;
                        isDragging = true;
                        startX = e.clientX;
                        startY = e.clientY;
                        initialLeft = parseFloat(cajaVisual.style.left);
                        initialTop = parseFloat(cajaVisual.style.top);
                        cajaVisual.setPointerCapture(e.pointerId);
                        e.stopPropagation();
                    });

                    cajaVisual.addEventListener('pointermove', (e) => {
                        if (!isDragging) return;
                        const dx = e.clientX - startX;
                        const dy = e.clientY - startY;

                        cajaVisual.style.left = `${initialLeft + dx}px`;
                        cajaVisual.style.top = `${initialTop + dy}px`;
                    });

                    const actualizarCoordenadasGlobales = () => {
                        const newLeft = parseFloat(cajaVisual.style.left) / scale;
                        const newTop = parseFloat(cajaVisual.style.top) / scale;
                        const widthPx = cajaVisual.offsetWidth / scale;
                        const heightPx = cajaVisual.offsetHeight / scale;

                        coordenadasMap[campo] = {
                            x1: newLeft,
                            y1: pageViewport.height / scale - newTop - heightPx,
                            x2: newLeft + widthPx,
                            y2: pageViewport.height / scale - newTop
                        };
                        btnGuardarCoordenadas.classList.remove('hidden');
                    };

                    cajaVisual.addEventListener('pointerup', (e) => {
                        if (isDragging) {
                            isDragging = false;
                            cajaVisual.releasePointerCapture(e.pointerId);
                        }
                        actualizarCoordenadasGlobales();
                    });

                    const observer = new ResizeObserver(() => {
                        if (modoEdicionActivo) actualizarCoordenadasGlobales();
                    });
                    observer.observe(cajaVisual);
                }

                drawingOverlay.appendChild(cajaVisual);
            }
        }

        btnGuardarCoordenadas.addEventListener('click', async () => {
            if (!escuelaSeleccionadaId) return alert("⚠️ Selecciona una escuela primero.");

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/school_templates?file_identifier=eq.${encodeURIComponent(escuelaSeleccionadaId)}`, {
                    method: 'PATCH',
                    headers: { ...headers, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
                    body: JSON.stringify({ coordinates_json: coordenadasMap })
                });

                if (response.ok) {
                    modoEdicionActivo = false;
                    btnActivarEdicion.textContent = "Activar Edición";
                    btnActivarEdicion.className = "bg-amber-600 hover:bg-amber-700 text-white text-[10px] px-2 py-1 rounded font-bold";
                    btnGuardarCoordenadas.classList.add('hidden');
                    redibujarOverlay();
                    estadoInfo.textContent = "💾 ¡Coordenadas guardadas correctamente en Supabase!";
                } else {
                    alert("❌ Error al guardar en Supabase.");
                }
            } catch (err) { console.error(err); alert("❌ Error de red."); }
        });

        btnGenerarPDFDirecto.addEventListener('click', async () => {
            if (!archivoPdfOriginalBytes) return alert("⚠️ Sube primero el PDF base.");
            if (Object.keys(coordenadasMap).length === 0) return alert("⚠️ Selecciona una escuela con coordenadas.");
            const semSeleccionada = selectSemana.value;
            if (!semSeleccionada) return alert("⚠️ Selecciona una semana.");

            try {
                estadoInfo.textContent = "⏳ Generando PDF final...";
                const pdfDocLib = await PDFLib.PDFDocument.load(archivoPdfOriginalBytes);
                const firstPage = pdfDocLib.getPages()[0];
                const { height: pdfHeight } = firstPage.getSize();
                const font = await pdfDocLib.embedFont(PDFLib.StandardFonts.Helvetica);
                const fontBold = await pdfDocLib.embedFont(PDFLib.StandardFonts.HelveticaBold);

                const datosSemana = semanasAgrupadas[semSeleccionada] || {};
                const nombreUsuario = selectUsuario.value;

                for (const [campo, box] of Object.entries(coordenadasMap)) {
                    if (!box || typeof box.x1 === 'undefined') continue;

                    const lowerKey = campo.toLowerCase();
                    let textoAsignado = '';

                    if (!lowerKey.includes('stunden') && !lowerKey.includes('hora') && !lowerKey.includes('zeit')) {
                        if (lowerKey.includes('montag') || lowerKey.includes('lunes')) textoAsignado = (datosSemana.lunes || []).join('\n');
                        else if (lowerKey.includes('dienstag') || lowerKey.includes('martes')) textoAsignado = (datosSemana.dienstag || []).join('\n');
                        else if (lowerKey.includes('mittwoch') || lowerKey.includes('miercoles')) textoAsignado = (datosSemana.mittwoch || []).join('\n');
                        else if (lowerKey.includes('donnerstag') || lowerKey.includes('jueves')) textoAsignado = (datosSemana.donnerstag || []).join('\n');
                        else if (lowerKey.includes('freitag') || lowerKey.includes('viernes')) textoAsignado = (datosSemana.freitag || []).join('\n');
                        else if (lowerKey.includes('schueler')) textoAsignado = nombreUsuario;
                    }

                    // VALIDACIÓN CLAVE: Si el texto está vacío, lo salta por completo y no imprime nada (deja el campo en blanco)
                    if (!textoAsignado || textoAsignado.trim() === '') continue;

                    const x = box.x1;
                    const y = pdfHeight - box.y2; 
                    const esEncabezado = lowerKey.includes('schueler') || lowerKey.includes('klasse') || lowerKey.includes('woche');
                    const fontSize = esEncabezado ? 7 : 5;

                    firstPage.drawText(textoAsignado, {
                        x: x,
                        y: y + 2,
                        size: fontSize,
                        font: esEncabezado ? fontBold : font,
                        color: PDFLib.rgb(0, 0, 0),
                        maxWidth: box.x2 - box.x1,
                        lineHeight: fontSize * 1.2
                    });
                }

                const pdfBytesFinales = await pdfDocLib.save();
                const blob = new Blob([pdfBytesFinales], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `Ausbildungsnachweis_${nombreUsuario}_${semSeleccionada}.pdf`;
                link.click();

                estadoInfo.textContent = "🎉 ¡PDF generado y descargado con éxito!";
            } catch (err) {
                console.error("DETALLE DEL ERROR PDF:", err);
                estadoInfo.textContent = "❌ Error al generar el PDF.";
                alert("Ocurrió un error al generar el archivo. Revisa que las coordenadas sean válidas.");
            }
        });
    </script>
</body>
</html>
