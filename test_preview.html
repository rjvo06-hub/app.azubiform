<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generador y Calibrador FOS - Azubiform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js para renderizar la vista previa -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- PDF-Lib para generar el PDF final -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        .draggable-box {
            touch-action: none;
            user-select: none;
            resize: both;
            overflow: auto;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-3 sm:p-6">

    <div class="max-w-7xl mx-auto space-y-4">
        <!-- Cabecera -->
        <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3">
            <h1 class="text-xs sm:text-sm font-bold text-indigo-900 uppercase">⚡ Generador y Calibrador de Coordenadas FOS</h1>
            <div class="w-full sm:w-auto">
                <input type="file" id="pdfFile" accept="application/pdf" class="text-[11px] text-gray-500 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[11px] file:font-semibold file:bg-indigo-50 file:text-indigo-700 w-full">
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <!-- Panel Izquierdo: Lienzo Interactivo -->
            <div class="lg:col-span-2 bg-gray-900 rounded-xl p-2 sm:p-4 flex justify-center overflow-auto max-h-[70vh] lg:max-h-[800px] relative border border-gray-300">
                <div class="relative inline-block shadow-2xl" id="canvasContainer">
                    <canvas id="pdfCanvas" class="block"></canvas>
                    <div id="drawingOverlay" class="absolute inset-0 pointer-events-none"></div>
                </div>
            </div>

            <!-- Panel Derecho: Controles y Calibración -->
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm space-y-3 flex flex-col justify-between">
                <div class="space-y-3">
                    <h2 class="text-xs font-bold text-gray-800 uppercase border-b pb-2">Controles y Calibración</h2>
                    
                    <!-- 1. Plantilla -->
                    <div class="bg-indigo-50 p-2.5 rounded-lg border border-indigo-200 space-y-1">
                        <label class="text-[10px] font-semibold text-indigo-900">📂 1. Seleccionar escuela:</label>
                        <select id="selectPlantillasGuardadas" class="w-full p-1.5 border border-indigo-300 rounded text-xs bg-white font-medium">
                            <option value="">-- Selecciona escuela --</option>
                        </select>
                    </div>

                    <!-- 2. Usuario y Semana -->
                    <div class="bg-emerald-50 p-2.5 rounded-lg border border-emerald-200 space-y-2">
                        <div>
                            <label class="text-[10px] font-semibold text-emerald-900">👤 2. Seleccionar usuario:</label>
                            <select id="selectUsuario" class="w-full p-1.5 border border-emerald-300 rounded text-xs bg-white font-medium">
                                <option value="">-- Selecciona usuario --</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-semibold text-emerald-900">📅 3. Seleccionar semana:</label>
                            <select id="selectSemana" class="w-full p-1.5 border border-emerald-300 rounded text-xs bg-white font-medium">
                                <option value="">-- Carga usuario primero --</option>
                            </select>
                        </div>
                    </div>

                    <!-- Herramienta de Calibración Global y Manual -->
                    <div class="bg-amber-50 p-2.5 rounded-lg border border-amber-200
