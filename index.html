<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azubiform - Login & Registrierung</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg overflow-hidden p-8">
        
        <!-- Logo / Cabecera -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-blue-600">Azubiform</h1>
            <p class="text-sm text-gray-500 mt-1">Digitale Führung deines Ausbildungsnachweises</p>
        </div>

        <!-- CONTENEDOR DE REGISTRO -->
        <div id="register-container">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">Neuen Benutzer registrieren</h2>
            
            <form id="formRegistro" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Vorname und Nachname</label>
                    <input type="text" id="nombreInput" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">E-Mail-Adresse</label>
                    <input type="email" id="emailInput" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Passwort</label>
                    <input type="password" id="passwordInput" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button type="submit" id="btnRegistrar" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg hover:bg-blue-700 transition duration-200">
                    Registrierung abschließen
                </button>
            </form>

            <div class="mt-6 text-center">
                <button onclick="toggleView('login')" class="text-sm text-blue-600 hover:underline">
                    Ich habe bereits ein Konto. Anmelden
                </button>
            </div>
        </div>

        <!-- CONTENEDOR DE LOGIN (Oculto por defecto) -->
        <div id="login-container" class="hidden">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">Anmelden</h2>
            
            <div id="alertaExito" class="hidden mb-4 p-3 bg-green-50 border-l-4 border-green-500 text-green-700 text-sm rounded">
                Konto erstellt! Bitte bestätige deine E-Mail, bevor du dich anmeldest.
            </div>

            <form id="formLogin" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">E-Mail-Adresse</label>
                    <input type="email" id="loginEmail" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Passwort</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg hover:bg-blue-700 transition duration-200">
                    Anmelden
                </button>
            </form>

            <div class="mt-6 text-center">
                <button onclick="toggleView('register')" class="text-sm text-blue-600 hover:underline">
                    Noch kein Konto? Registrieren
                </button>
            </div>
        </div>

    </div>

    <!-- Script de lógica y conexión con Supabase / API -->
    <script>
        // Función para alternar vistas entre Registro y Login
        function toggleView(view) {
            const regContainer = document.getElementById('register-container');
            const loginContainer = document.getElementById('login-container');
            
            if (view === 'login') {
                regContainer.classList.add('hidden');
                loginContainer.classList.remove('hidden');
            } else {
                loginContainer.classList.add('hidden');
                regContainer.classList.remove('hidden');
            }
        }

        // Manejo del formulario de registro
        document.getElementById('formRegistro').addEventListener('submit', async function(e) {
            e.preventDefault();

            const nombre = document.getElementById('nombreInput').value;
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const btn = document.getElementById('btnRegistrar');

            btn.disabled = true;
            btn.textContent = "Wird verarbeitet...";

            try {
                // Simulación o llamada real a tu registro (ej. Supabase Auth)
                // const { data, error } = await supabase.auth.signUp({ email, password, options: { data: { full_name: nombre } } });
                
                // Generamos un token simulado para el ejemplo (reemplaza esto con el token real de tu backend/base de datos)
                const tokenGenerado = Math.random().toString(36.substring(2)) + Date.now().toString(36);

                // Llamada a tu API de Vercel para enviar el correo personalizado en alemán
                const response = await fetch('/api/enviar-correo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        nombre: nombre,
                        token: tokenGenerado
                    })
                });

                if (response.ok) {
                    // Cambiar a la vista de login y mostrar alerta de éxito
                    document.getElementById('alertaExito').classList.remove('hidden');
                    document.getElementById('loginEmail').value = email; // Autocompletar el correo
                    toggleView('login');
                } else {
                    alert('Konto erstellt, aber Fehler beim Senden der Bestätigungs-E-Mail.');
                    toggleView('login');
                }

            } catch (error) {
                console.error('Fehler:', error);
                alert('Ein unerwarteter Fehler ist aufgetreten.');
            } finally {
                btn.disabled = false;
                btn.textContent = "Registrierung abschließen";
            }
        });

        // Manejo del formulario de Login
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            // Aquí agregas tu lógica para iniciar sesión con Supabase
            alert('Anmeldung wird verarbeitet...');
        });
    </script>

</body>
</html>
