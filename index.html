<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azubiform - Registro de Actividades de Formación</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos específicos para las líneas de la hoja de impresión del Ausbildung */
        .linea-impresion {
            position: absolute; 
            left: 30mm; 
            width: 160mm; 
            height: 5.5mm; 
            line-height: 5.5mm; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
            font-family: Terminal, "Courier New", Courier, monospace; 
            font-size: 10pt; 
            box-sizing: border-box;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #modalImpresionAusbildung, #modalImpresionAusbildung * {
                visibility: visible;
            }
            #modalImpresionAusbildung {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background: white;
            }
            .no-imprimir {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- CONTENEDOR PRINCIPAL DE LA APLICACIÓN -->
    <div id="app" class="container mx-auto px-4 py-8">
        <header class="flex justify-between items-center mb-6 bg-white p-4 rounded-lg shadow">
            <h1 class="text-2xl font-bold text-blue-600">Azubiform</h1>
            <div class="flex gap-3">
                <button onclick="abrirModalImpresionAusbildung()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-medium transition">
                    Imprimir Informe / Ausbildungsnachweis
                </button>
            </div>
        </header>

        <!-- Panel de Registro Diario (Contenido Principal) -->
        <main class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-semibold mb-4">Registro Diario de Actividades</h2>
            <div id="contenedorRegistros" class="space-y-4">
                <!-- Aquí se cargan dinámicamente tus formularios y registros diarios -->
                <p class="text-gray-500">Cargando datos de la jornada...</p>
            </div>
        </main>
    </div>

    <!-- MODAL DE IMPRESIÓN / AUSBILDUNGSNACHWEIS -->
    <div id="modalImpresionAusbildung" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
            
            <!-- Cabecera del Modal (Controles) -->
            <div class="p-4 bg-gray-800 text-white flex justify-between items-center no-imprimir">
                <div class="flex items-center gap-4">
                    <h3 class="font-bold text-lg">Vista Previa de Impresión</h3>
                    <select id="selectUsuarioImpresion" class="bg-gray-700 text-white px-3 py-1.5 rounded border border-gray-600 text-sm">
                        <option value="">Cargando usuarios...</option>
                    </select>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="cambiarSemanaImpresion(-1)" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded text-sm transition">← Semana Anterior</button>
                    <span id="lblSemanaImpresion" class="text-sm font-medium px-2">-- / --</span>
                    <button onclick="cambiarSemanaImpresion(1)" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded text-sm transition">Semana Siguiente →</button>
                    <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded text-sm font-medium transition">Imprimir</button>
                    <button onclick="cerrarModalImpresionAusbildung()" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded text-sm font-medium transition">✕ Cerrar</button>
                </div>
            </div>

            <!-- Cuerpo de la Hoja de Impresión (Simulación A4 / Formulario Oficial) -->
            <div class="p-6 overflow-y-auto flex-grow bg-gray-50 flex justify-center">
                <!-- Contenedor de la hoja simulada A4 -->
                <div id="hojaAusbildung" class="relative bg-white shadow-lg w-[210mm] h-[297mm] p-[10mm] text-black text-sm">
                    
                    <!-- Datos de Encabezado en la Hoja -->
                    <div class="absolute top-[25mm] left-[30mm] font-bold" id="pr_nombre">Nombre del Usuario</div>
                    <div class="absolute top-[25mm] left-[150mm]" id="pr_semana_inicio">00.00</div>
                    <div class="absolute top-[25mm] left-[170mm]" id="pr_semana_fin">00.00</div>
                    <div class="absolute top-[25mm] left-[195mm]" id="pr_ano_fin">26</div>

                    <!-- LUNES (m) -->
                    <div style="top: 45mm;" class="linea-impresion" id="pr_m1"></div>
                    <div style="top: 51mm;" class="linea-impresion" id="pr_m2"></div>
                    <div style="top: 57mm;" class="linea-impresion" id="pr_m3"></div>
                    <div style="top: 63mm;" class="linea-impresion" id="pr_m4"></div>
                    <div style="top: 69mm;" class="linea-impresion" id="pr_m5"></div>
                    <div style="top: 75mm;" class="linea-impresion" id="pr_m6"></div>

                    <!-- MARTES (di) -->
                    <div style="top: 89mm;" class="linea-impresion" id="pr_di1"></div>
                    <div style="top: 95mm;" class="linea-impresion" id="pr_di2"></div>
                    <div style="top: 101mm;" class="linea-impresion" id="pr_di3"></div>
                    <div style="top: 107mm;" class="linea-impresion" id="pr_di4"></div>
                    <div style="top: 113mm;" class="linea-impresion" id="pr_di5"></div>
                    <div style="top: 119mm;" class="linea-impresion" id="pr_di6"></div>

                    <!-- MIÉRCOLES (mi) -->
                    <div style="top: 133mm;" class="linea-impresion" id="pr_mi1"></div>
                    <div style="top: 139mm;" class="linea-impresion" id="pr_mi2"></div>
                    <div style="top: 145mm;" class="linea-impresion" id="pr_mi3"></div>
                    <div style="top: 151mm;" class="linea-impresion" id="pr_mi4"></div>
                    <div style="top: 157mm;" class="linea-impresion" id="pr_mi5"></div>
                    <div style="top: 163mm;" class="linea-impresion" id="pr_mi6"></div>

                    <!-- JUEVES (do) -->
                    <div style="top: 177mm;" class="linea-impresion" id="pr_do1"></div>
                    <div style="top: 183mm;" class="linea-impresion" id="pr_do2"></div>
                    <div style="top: 189mm;" class="linea-impresion" id="pr_do3"></div>
                    <div style="top: 195mm;" class="linea-impresion" id="pr_do4"></div>
                    <div style="top: 201mm;" class="linea-impresion" id="pr_do5"></div>
                    <div style="top: 207mm;" class="linea-impresion" id="pr_do6"></div>

                    <!-- VIERNES (fr) - Totalmente corregido -->
                    <div style="top: 221mm;" class="linea-impresion" id="pr_fr1"></div>
                    <div style="top: 227mm;" class="linea-impresion" id="pr_fr2"></div>
                    <div style="top: 233mm;" class="linea-impresion" id="pr_fr3"></div>
                    <div style="top: 239mm;" class="linea-impresion" id="pr_fr4"></div>
                    <div style="top: 245mm;" class="linea-impresion" id="pr_fr5"></div>
                    <div style="top: 251mm;" class="linea-impresion" id="pr_fr6"></div>

                </div>
            </div>

        </div>
    </div>

    <!-- Script principal de la aplicación que inicializa las funciones de impresión -->
    <script type="module">
        import { inicializarImpresion } from './js/print.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            inicializarImpresion();
            // Aquí puedes inicializar el resto de módulos de tu app (ej. registros, autenticación, etc.)
        });
    </script>
</body>
</html>
