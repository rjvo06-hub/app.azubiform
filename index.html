    <script type="module">
        import { inicializarAuth } from './js/auth.js';
        import { iniciarAppPrincipal } from './js/app.js';
        import { inicializarHistorial } from './js/history.js';
        import { inicializarImpresion } from './js/print.js';

        function verificarPermisosAdmin() {
            const acceso = localStorage.getItem('usuario_acceso');
            if (Number(acceso) === 1) {
                document.getElementById('btnMenuImpresion').classList.remove('hidden');
                document.getElementById('sepMenuImpresion').classList.remove('hidden');
            } else {
                document.getElementById('btnMenuImpresion').classList.add('hidden');
                document.getElementById('sepMenuImpresion').classList.add('hidden');
            }
        }

        window.cerrarSesion = function() {
            localStorage.removeItem('usuario_actual');
            localStorage.removeItem('usuario_acceso');
            
            // ---> AGREGA ESTAS LÍNEAS PARA LIMPIAR LOS CAMPOS <---
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginMensaje').classList.add('hidden');
            // ----------------------------------------------------

            document.getElementById('appSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.body.classList.add('justify-center');
            inicializarAuth((nombre) => {
                verificarPermisosAdmin();
                iniciarAppPrincipal(nombre);
                inicializarHistorial();
                inicializarImpresion();
            });
        };

        const usuarioGuardado = localStorage.getItem('usuario_actual');
