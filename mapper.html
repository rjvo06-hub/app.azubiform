<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapeador Dinámico Universal FOS - Azubiform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Cabecera -->
        <div class="bg-white p-4 rounded-xl shadow-sm flex items-center justify-between">
            <h1 class="text-xs font-bold text-indigo-900 uppercase">🌐 Mapeador Dinámico Universal (Lectura en Vivo de PDF)</h1>
            <div class="flex items-center space-x-3">
                <input type="file" id="pdfFile" accept="application/pdf" class="text-xs text-gray-500 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                <button id="btnGuardarSupabase" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-lg shadow transition">Guardar en Supabase</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Panel Izquierdo: Lienzo del PDF -->
            <div class="lg:col-span-2 bg-white rounded-xl p-4 flex justify-center overflow-auto max-h-[800px] relative border border-gray-300 shadow-inner">
                <div class="relative inline-block cursor-crosshair" id="canvasContainer">
                    <canvas id="pdfCanvas" class="block shadow-md"></canvas>
                    <div id="drawingOverlay" class="absolute inset-0 pointer-events-none"></div>
                </div>
            </div>

            <!-- Panel Derecho: Etiquetas detectadas en el PDF y mapeo -->
            <div class="bg-white p-4 rounded-xl shadow-sm space-y-4 flex flex-col h-[800px]">
                <h2 class="text-xs font-bold text-gray-800 uppercase border-b pb-2">1. Selecciona o crea el campo a mapear</h2>
                
                <div class="space-y-3">
                    <div>
                        <label class="text-[11px] font-semibold text-gray-700">Etiquetas leídas automáticamente del PDF:</label>
                        <select id="detectedLabelsSelect" class="w-full p-2 border border-gray-300 rounded-lg text-xs bg-white focus:ring-2 focus:ring-indigo-500 mt-1">
                            <option value="">-- Sube un PDF primero --</option>
                        </select>
                    </div>

                    <div class="relative flex py-2 items-center">
                        <div class="flex-grow border-t border-gray-200"></div>
                        <span class="flex-shrink mx-4 text-[10px] text-gray-400 uppercase">o escribe un nombre personalizado</span>
                        <div class="flex-grow border-t border-gray-200"></div>
                    </div>

                    <div>
                        <input type="text" id="customFieldInput" placeholder="Ej: montag, schueler, betrieb..." class="w-full p-2 border border-gray-300 rounded-lg text-xs bg-white focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <p class="text-[10px] text-gray-500 bg-indigo-50 p-2 rounded border border-indigo-100">
                        💡 <b>Cómo usar:</b> Selecciona una etiqueta o escribe un nombre, luego haz clic y arrastra el ratón sobre el área correspondiente del PDF.
                    </p>
                </div>

                <!-- Lista de campos mapeados -->
                <div class="flex-1 overflow-y-auto border border-gray-200 rounded-lg p-2 space-y-2 bg-gray-50" id="listaCoordenadas">
                    <p class="text-[11px] text-gray-400 text-center mt-4">No hay coordenadas capturadas aún.</p>
                </div>

                <!-- JSON Exportado -->
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-gray-700">JSON Generado:</label>
                    <textarea id="jsonOutput" readonly class="w-full h-24 p-2 text-[10px] font-mono bg-gray-900 text-green-400 rounded-lg border border-gray-700 focus:outline-none"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { SUPABASE_URL, headers } from './js/config.js';

        const fileInput = document.getElementById('pdfFile');
        const canvas = document.getElementById('pdfCanvas');
        const container = document.getElementById('canvasContainer');
        const drawingOverlay = document.getElementById('drawingOverlay');
        const detectedLabelsSelect = document.getElementById('detectedLabelsSelect');
        const customFieldInput = document.getElementById('customFieldInput');
        const listaCoordenadas = document.getElementById('listaCoordenadas');
        const jsonOutput = document.getElementById('jsonOutput');
        const btnGuardar = document.getElementById('btnGuardarSupabase');

        let pdfDoc = null;
        let pageViewport = null;
        let scale = 1.5;
        let coordenadasMap = {};
        
        let isDrawing = false;
        let startX = 0, startY = 0;
        let currentRect = null;

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const fileReader = new FileReader();
            fileReader.onload = async function() {
                try {
                    const typedarray = new Uint8Array(this.result);
                    const loadingTask = pdfjsLib.getDocument({ data: typedarray });
                    pdfDoc = await loadingTask.promise;
                    await renderPage(1);
                    await extraerTextoDinamico(pdfDoc);
                } catch (err) {
                    console.error("Error al leer el PDF:", err);
                    alert("❌ No se pudo procesar el archivo PDF.");
                }
            };
            fileReader.readAsArrayBuffer(file);
        });

        async function renderPage(num) {
            const page = await pdfDoc.getPage(num);
            pageViewport = page.getViewport({ scale });

            const context = canvas.getContext('2d');
            canvas.height = pageViewport.height;
            canvas.width = pageViewport.width;

            await page.render({ canvasContext: context, viewport: pageViewport }).promise;
        }

        // Extracción dinámica de todas las palabras/textos reales que contiene este PDF específico
        async function extraerTextoDinamico(pdf) {
            const page = await pdf.getPage(1);
            const textContent = await page.getTextContent();
            
            detectedLabelsSelect.innerHTML = '<option value="">-- Selecciona etiqueta detectada --</option>';
            
            // Filtrar textos únicos y significativos encontrados en el documento
            const textosUnicos = [...new Set(textContent.items.map(item => item.str.trim()).filter(t => t.length > 1))]
                .sort();

            textosUnicos.forEach(texto => {
                const opt = document.createElement('option');
                opt.value = texto.toLowerCase().replace(/[^a-z0-9]/g, '_');
                opt.textContent = texto;
                detectedLabelsSelect.appendChild(opt);
            });
        }

        // Sincronizar el select con el input personalizado
        detectedLabelsSelect.addEventListener('change', (e) => {
            if (e.target.value) {
                customFieldInput.value = e.target.value;
            }
        });

        container.addEventListener('mousedown', (e) => {
            if (!pdfDoc) return;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
            isDrawing = true;

            currentRect = document.createElement('div');
            currentRect.className = 'absolute border-2 border-indigo-600 bg-indigo-500/25 rounded pointer-events-none';
            currentRect.style.left = `${startX}px`;
            currentRect.style.top = `${startY}px`;
            drawingOverlay.appendChild(currentRect);
        });

        container.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            const width = currentX - startX;
            const height = currentY - startY;

            currentRect.style.width = `${Math.abs(width)}px`;
            currentRect.style.height = `${Math.abs(height)}px`;
            currentRect.style.left = `${width < 0 ? currentX : startX}px`;
            currentRect.style.top = `${height < 0 ? currentY : startY}px`;
        });

        container.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;

            const rect = canvas.getBoundingClientRect();
            const endX = e.clientX - rect.left;
            const endY = e.clientY - rect.top;

            const canvasX1 = Math.min(startX, endX);
            const canvasX2 = Math.max(startX, endX);
            const canvasY1 = Math.min(startY, endY);
            const canvasY2 = Math.max(startY, endY);

            if ((canvasX2 - canvasX1) < 5 || (canvasY2 - canvasY1) < 5) {
                if (currentRect) currentRect.remove();
                return;
            }

            const pdfX1 = canvasX1 / scale;
            const pdfX2 = canvasX2 / scale;
            const pdfY1 = (pageViewport.height - canvasY2) / scale;
            const pdfY2 = (pageViewport.height - canvasY1) / scale;

            // Obtener el nombre del campo desde el input personalizado (que se llena con el select o a mano)
            const campoActual = customFieldInput.value.trim() || `campo_${Object.keys(coordenadasMap).length + 1}`;
            
            coordenadasMap[campoActual] = {
                x1: Math.round(pdfX1 * 10) / 10,
                y1: Math.round(pdfY1 * 10) / 10,
                x2: Math.round(pdfX2 * 10) / 10,
                y2: Math.round(pdfY2 * 10) / 10
            };

            // Dibujar caja permanente en pantalla
            const cajaFija = document.createElement('div');
            cajaFija.className = 'absolute border border-indigo-700 bg-indigo-500/30 rounded text-[9px] text-indigo-900 font-bold px-1 flex items-center justify-between pointer-events-none';
            cajaFija.style.left = `${canvasX1}px`;
            cajaFija.style.top = `${canvasY1}px`;
            cajaFija.style.width = `${canvasX2 - canvasX1}px`;
            cajaFija.style.height = `${canvasY2 - canvasY1}px`;
            cajaFija.textContent = campoActual;
            drawingOverlay.appendChild(cajaFija);

            if (currentRect) currentRect.remove();
            actualizarUI();
            customFieldInput.value = ''; // Limpiar input para el siguiente
        });

        function actualizarUI() {
            listaCoordenadas.innerHTML = '';
            jsonOutput.value = JSON.stringify(coordenadasMap, null, 2);

            for (const [campo, box] of Object.entries(coordenadasMap)) {
                const item = document.createElement('div');
                item.className = 'bg-white p-2 rounded border border-gray-200 text-xs flex justify-between items-center shadow-xs';
                item.innerHTML = `
                    <div>
                        <span class="font-bold text-indigo-900">${campo}</span>
                        <div class="text-[10px] text-gray-500 font-mono">x1:${box.x1}, y1:${box.y1}, x2:${box.x2}, y2:${box.y2}</div>
                    </div>
                    <button class="text-red-500 hover:text-red-700 text-xs font-bold px-2 py-1" onclick="window.eliminarCampo('${campo}')">🗑️</button>
                `;
                listaCoordenadas.appendChild(item);
            }
        }

        window.eliminarCampo = function(campo) {
            delete coordenadasMap[campo];
            actualizarUI();
        };

        btnGuardar.addEventListener('click', async () => {
            const schoolName = prompt("Introduce el nombre exacto de esta escuela:");
            if (!schoolName) return;

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/school_templates`, {
                    method: 'POST',
                    headers: { ...headers, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
                    body: JSON.stringify({
                        school_name: schoolName,
                        pdf_filename: fileInput.files[0] ? fileInput.files[0].name : 'template.pdf',
                        coordinates_json: coordenadasMap
                    })
                });

                if (response.ok) {
                    alert("✅ ¡Plantilla dinámica guardada con éxito en Supabase!");
                } else {
                    const err = await response.text();
                    alert("❌ Error al guardar: " + err);
                }
            } catch (err) {
                console.error(err);
                alert("❌ Error de red al conectar con Supabase.");
            }
        });
    </script>
</body>
</html>
