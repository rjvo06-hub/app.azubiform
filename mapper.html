<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapeador Visual de Plantillas FOS - Azubiform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Cabecera -->
        <div class="bg-white p-4 rounded-xl shadow-sm flex items-center justify-between">
            <h1 class="text-sm font-bold text-indigo-900 uppercase">🎯 Mapeador Visual de Coordenadas FOS</h1>
            <div class="flex items-center space-x-3">
                <input type="file" id="pdfFile" accept="application/pdf" class="text-xs text-gray-500 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                <button id="btnGuardarSupabase" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-lg shadow transition">Guardar en Supabase</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Panel Izquierdo: Lienzo del PDF -->
            <div class="lg:col-span-2 bg-gray-900 rounded-xl p-4 flex justify-center overflow-auto max-h-[800px] relative border border-gray-300">
                <div class="relative inline-block cursor-crosshair" id="canvasContainer">
                    <canvas id="pdfCanvas" class="block shadow-lg"></canvas>
                    <div id="drawingOverlay" class="absolute inset-0 pointer-events-none"></div>
                </div>
            </div>

            <!-- Panel Derecho: Gestión de Campos y Coordenadas -->
            <div class="bg-white p-4 rounded-xl shadow-sm space-y-4 flex flex-col h-[800px]">
                <h2 class="text-xs font-bold text-gray-800 uppercase border-b pb-2">Campos Mapeados</h2>
                
                <div class="space-y-2">
                    <label class="text-xs font-semibold text-gray-700">Nombre del Campo:</label>
                    <select id="campoSelect" class="w-full p-2 border border-gray-300 rounded-lg text-xs bg-white focus:ring-2 focus:ring-indigo-500">
                        <option value="schueler">Schüler (Nombre)</option>
                        <option value="klasse">Klasse (Clase)</option>
                        <option value="woche_vom">Woche vom (Semana)</option>
                        <option value="montag">Montag (Lunes)</option>
                        <option value="dienstag">Dienstag (Martes)</option>
                        <option value="mittwoch">Mittwoch (Miércoles)</option>
                        <option value="donnerstag">Donnerstag (Jueves)</option>
                        <option value="freitag">Freitag (Viernes)</option>
                    </select>
                    <p class="text-[11px] text-gray-500">Haz clic y arrastra sobre el PDF para seleccionar el área del campo seleccionado.</p>
                </div>

                <!-- Lista de campos guardados -->
                <div class="flex-1 overflow-y-auto border border-gray-200 rounded-lg p-2 space-y-2 bg-gray-50" id="listaCoordenadas">
                    <p class="text-[11px] text-gray-400 text-center mt-4">No hay coordenadas capturadas aún.</p>
                </div>

                <!-- JSON Exportado -->
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-gray-700">JSON de Coordenadas:</label>
                    <textarea id="jsonOutput" readonly class="w-full h-28 p-2 text-[10px] font-mono bg-gray-900 text-green-400 rounded-lg border border-gray-700 focus:outline-none"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { SUPABASE_URL, headers } from './js/config.js';

        const fileInput = document.getElementById('pdfFile');
        const canvas = document.getElementById('pdfCanvas');
        const container = document.getElementById('canvasContainer');
        const drawingOverlay = document.getElementById('drawingOverlay');
        const campoSelect = document.getElementById('campoSelect');
        const listaCoordenadas = document.getElementById('listaCoordenadas');
        const jsonOutput = document.getElementById('jsonOutput');
        const btnGuardar = document.getElementById('btnGuardarSupabase');

        let pdfDoc = null;
        let pageViewport = null;
        let scale = 1.5;
        let coordenadasMap = {};
        
        // Variables para dibujo por arrastre
        let isDrawing = false;
        let startX = 0, startY = 0;
        let currentRect = null;

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const fileReader = new FileReader();
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                const loadingTask = pdfjsLib.getDocument(typedarray);
                pdfDoc = await loadingTask.promise;
                renderPage(1);
            };
            fileReader.readAsArrayBuffer(file);
        });

        async function renderPage(num) {
            const page = await pdfDoc.getPage(num);
            pageViewport = page.getViewport({ scale });

            const context = canvas.getContext('2d');
            canvas.height = pageViewport.height;
            canvas.width = pageViewport.width;

            await page.render({ canvasContext: context, viewport: pageViewport }).promise;
        }

        // Eventos de ratón para dibujar cajas
        container.addEventListener('mousedown', (e) => {
            if (!pdfDoc) return;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
            isDrawing = true;

            currentRect = document.createElement('div');
            currentRect.className = 'absolute border-2 border-indigo-600 bg-indigo-500/20 rounded pointer-events-none';
            currentRect.style.left = `${startX}px`;
            currentRect.style.top = `${startY}px`;
            drawingOverlay.appendChild(currentRect);
        });

        container.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            const width = currentX - startX;
            const height = currentY - startY;

            currentRect.style.width = `${Math.abs(width)}px`;
            currentRect.style.height = `${Math.abs(height)}px`;
            currentRect.style.left = `${width < 0 ? currentX : startX}px`;
            currentRect.style.top = `${height < 0 ? currentY : startY}px`;
        });

        container.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;

            const rect = canvas.getBoundingClientRect();
            const endX = e.clientX - rect.left;
            const endY = e.clientY - rect.top;

            // Calcular coordenadas en el sistema nativo del PDF (invirtiendo el eje Y)
            const canvasX1 = Math.min(startX, endX);
            const canvasX2 = Math.max(startX, endX);
            const canvasY1 = Math.min(startY, endY);
            const canvasY2 = Math.max(startY, endY);

            // Evitar cajas accidentales muy pequeñas
            if ((canvasX2 - canvasX1) < 5 || (canvasY2 - canvasY1) < 5) {
                currentRect.remove();
                return;
            }

            const pdfX1 = canvasX1 / scale;
            const pdfX2 = canvasX2 / scale;
            // Invertir Y del canvas al sistema de PDF
            const pdfY1 = (pageViewport.height - canvasY2) / scale;
            const pdfY2 = (pageViewport.height - canvasY1) / scale;

            const campoActual = campoSelect.value;
            coordenadasMap[campoActual] = {
                x1: Math.round(pdfX1 * 10) / 10,
                y1: Math.round(pdfY1 * 10) / 10,
                x2: Math.round(pdfX2 * 10) / 10,
                y2: Math.round(pdfY2 * 10) / 10
            };

            actualizarUI();
        });

        function actualizarUI() {
            listaCoordenadas.innerHTML = '';
            jsonOutput.value = JSON.stringify(coordenadasMap, null, 2);

            for (const [campo, box] of Object.entries(coordenadasMap)) {
                const item = document.createElement('div');
                item.className = 'bg-white p-2 rounded border border-gray-200 text-xs flex justify-between items-center shadow-xs';
                item.innerHTML = `
                    <div>
                        <span class="font-bold text-indigo-900">${campo}</span>
                        <div class="text-[10px] text-gray-500 font-mono">x1:${box.x1}, y1:${box.y1}, x2:${box.x2}, y2:${box.y2}</div>
                    </div>
                    <button class="text-red-500 hover:text-red-700 text-xs font-bold px-2 py-1" onclick="window.eliminarCampo('${campo}')">🗑️</button>
                `;
                listaCoordenadas.appendChild(item);
            }
        }

        window.eliminarCampo = function(campo) {
            delete coordenadasMap[campo];
            actualizarUI();
            // Redibujar overlay visual si se desea limpiar
        };

        btnGuardar.addEventListener('click', async () => {
            const schoolName = prompt("Introduce el nombre exacto de la escuela (ej. Berufliche Oberschule Holzkirchen):");
            if (!schoolName) return;

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/school_templates`, {
                    method: 'POST',
                    headers: { ...headers, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
                    body: JSON.stringify({
                        school_name: schoolName,
                        pdf_filename: 'admin.pdf',
                        coordinates_json: coordenadasMap
                    })
                });

                if (response.ok) {
                    alert("✅ ¡Plantilla y coordenadas guardadas con éxito en Supabase!");
                } else {
                    const err = await response.text();
                    alert("❌ Error al guardar: " + err);
                }
            } catch (err) {
                console.error(err);
                alert("❌ Error de red al conectar con Supabase.");
            }
        });
    </script>
</body>
</html>
