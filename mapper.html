<script type="module">
        import { SUPABASE_URL, headers } from './js/config.js';

        const $ = id => document.getElementById(id);
        let pdfDoc = null, pageViewport = null, scale = 1.2, coordenadasMap = {}, campoActivo = 'campo_1', primerPunto = null, escuelaCargada = null, campoPendienteDuplicar = null;
        let isDragging = false, dragCampo = null, startX = 0, startY = 0;
        let columnasUsuariosCache = [];
        let datosPreviewCache = { usuario: null, registros: [], activo: false };

        const sigCampo = () => `campo_${Object.keys(coordenadasMap).length + 1}`;

        function obtenerKeysOrdenadas(mapa) {
            const ordenDias = ['montag', 'dienstag', 'mittwoch', 'donnerstag', 'freitag'];
            const keys = Object.keys(mapa);
            
            return keys.sort((a, b) => {
                const aEsCampo = a.startsWith('campo_');
                const bEsCampo = b.startsWith('campo_');
                const aEsDia = ordenDias.includes(a);
                const bEsDia = ordenDias.includes(b);

                if (aEsCampo && bEsCampo) {
                    const numA = parseInt(a.replace('campo_', '')) || 0;
                    const numB = parseInt(b.replace('campo_', '')) || 0;
                    return numA - numB;
                }
                if (aEsCampo) return -1;
                if (bEsCampo) return 1;

                if (aEsDia && bEsDia) {
                    return ordenDias.indexOf(a) - ordenDias.indexOf(b);
                }
                if (aEsDia) return 1;
                if (bEsDia) return -1;

                return a.localeCompare(b);
            });
        }

        function normalizarOrdenMapa() {
            const keysOrdenadas = obtenerKeysOrdenadas(coordenadasMap);
            const nuevoMapa = {};
            keysOrdenadas.forEach(k => {
                nuevoMapa[k] = coordenadasMap[k];
            });
            coordenadasMap = nuevoMapa;
        }

        async function obtenerColumnasUsuariosEnVivo() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/usuarios?limit=1`, { headers: { ...headers, 'Range': '0-0' } });
                if (res.ok) {
                    const data = await res.json();
                    if (data.length > 0) {
                        columnasUsuariosCache = Object.keys(data[0]);
                    } else {
                        columnasUsuariosCache = ["id", "nombre", "email", "class", "teacher", "workplace", "ausbildung", "adresse"];
                    }
                }
            } catch (e) {
                console.error("Error al consultar columnas en vivo:", e);
                columnasUsuariosCache = ["id", "nombre", "email", "class", "teacher", "workplace", "ausbildung"];
            }
            return columnasUsuariosCache;
        }

        async function cargarPlantillas() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/school_templates?select=school_name,file_identifier`, { headers: { ...headers, 'Range': '0-999' } });
                if (res.ok) {
                    const data = await res.json();
                    $('selectPlantillas').innerHTML = '<option value="">-- Cargar guardada --</option>' + data.map(i => `<option value="${i.file_identifier}">${i.school_name}</option>`).join('');
                }
            } catch (e) { console.error(e); }
        }

        async function poblarUsuariosSelect() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/usuarios?select=*`, { headers: { ...headers, 'Range': '0-999' } });
                if (res.ok) {
                    const data = await res.json();
                    const colNombre = columnasUsuariosCache.includes('nombre') ? 'nombre' : (columnasUsuariosCache[1] || columnasUsuariosCache[0]);
                    $('selectPreviewUsuario').innerHTML = '<option value="">-- Seleccionar Usuario --</option>' + data.map(u => {
                        const nombreVal = u[colNombre] || u.nombre || u.email;
                        return `<option value="${nombreVal}">${nombreVal}</option>`;
                    }).join('');
                }
            } catch (e) { console.error("Error cargando usuarios:", e); }
        }

        (async () => {
            await obtenerColumnasUsuariosEnVivo();
            cargarPlantillas();
        })();

        $('btnCargar').onclick = async () => {
            const id = $('selectPlantillas').value;
            if (!id) return alert("Selecciona una plantilla.");
            const res = await fetch(`${SUPABASE_URL}/rest/v1/school_templates?file_identifier=eq.${encodeURIComponent(id)}&select=*`, { headers: { ...headers, 'Range': '0-999' } });
            if (res.ok) {
                const data = await res.json();
                if (data.length && data[0].coordinates_json) {
                    const parsed = data[0].coordinates_json;
                    coordenadasMap = parsed.coordenadas || parsed;
                    normalizarOrdenMapa();
                    escuelaCargada = { school_name: data[0].school_name, file_identifier: data[0].file_identifier };
                    actualizarSelects();
                    datosPreviewCache.activo = false;
                    if (pdfDoc) redibujar();
                    $('btnAbrirPreview').classList.remove('hidden');
                    alert(`✅ Plantilla cargada.`);
                }
            }
        };

        $('pdfFile').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            pdfDoc = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
            datosPreviewCache.activo = false;
            renderPage(1);
            $('btnAbrirPreview').classList.remove('hidden');
        };

        $('btnAbrirPreview').onclick = async () => {
            await poblarUsuariosSelect();
            $('previewModal').classList.remove('hidden');
        };

        window.cerrarModalPreview = () => { $('previewModal').classList.add('hidden'); };

        $('inputFechaLunes').onchange = (e) => {
            const val = e.target.value;
            if (!val) {
                $('rangoCalculadoInfo').classList.add('hidden');
                return;
            }
            
            const [year, month, day] = val.split('-').map(Number);
            const fechaLunes = new Date(year, month - 1, day);
            
            if (fechaLunes.getDay() !== 1) {
                alert("⚠️ Por favor, selecciona obligatoriamente un día Lunes.");
                e.target.value = '';
                $('rangoCalculadoInfo').classList.add('hidden');
                return;
            }

            const fechaViernes = new Date(fechaLunes);
            fechaViernes.setDate(fechaLunes.getDate() + 4);

            const fInicioStr = `${fechaLunes.getFullYear()}-${String(fechaLunes.getMonth() + 1).padStart(2, '0')}-${String(fechaLunes.getDate()).padStart(2, '0')}`;
            const fFinStr = `${fechaViernes.getFullYear()}-${String(fechaViernes.getMonth() + 1).padStart(2, '0')}-${String(fechaViernes.getDate()).padStart(2, '0')}`;

            $('lblRangoMostrado').textContent = `${fInicioStr} al ${fFinStr} (Lun - Vie)`;
            $('rangoCalculadoInfo').classList.remove('hidden');
        };

        window.ejecutarVistaPreviaInteligente = async () => {
            const nombreUsuario = $('selectPreviewUsuario').value;
            const fechaLunesVal = $('inputFechaLunes').value;

            if (!nombreUsuario) return alert("Por favor selecciona un usuario.");
            if (!fechaLunesVal) return alert("Por favor selecciona la fecha del lunes.");

            const [year, month, day] = fechaLunesVal.split('-').map(Number);
            const fechaLunes = new Date(year, month - 1, day);
            
            if (fechaLunes.getDay() !== 1) {
                return alert("⚠️ La fecha seleccionada debe ser un día Lunes.");
            }

            const fechaViernes = new Date(fechaLunes);
            fechaViernes.setDate(fechaLunes.getDate() + 4);

            const fechaInicio = `${fechaLunes.getFullYear()}-${String(fechaLunes.getMonth() + 1).padStart(2, '0')}-${String(fechaLunes.getDate()).padStart(2, '0')}`;
            const fechaFin = `${fechaViernes.getFullYear()}-${String(fechaViernes.getMonth() + 1).padStart(2, '0')}-${String(fechaViernes.getDate()).padStart(2, '0')}`;

            try {
                const resUser = await fetch(`${SUPABASE_URL}/rest/v1/usuarios?nombre=eq.${encodeURIComponent(nombreUsuario)}&limit=1`, { headers });
                const userData = resUser.ok ? await resUser.json() : [];
                
                if (!userData.length) {
                    const resUserFallback = await fetch(`${SUPABASE_URL}/rest/v1/usuarios?limit=1`, { headers });
                    const userFallbackData = resUserFallback.ok ? await resUserFallback.json() : [];
                    datosPreviewCache.usuario = userFallbackData.length ? userFallbackData[0] : { nombre: nombreUsuario };
                } else {
                    datosPreviewCache.usuario = userData[0];
                }

                const queryReg = `${SUPABASE_URL}/rest/v1/registro_diario?usuario=eq.${encodeURIComponent(nombreUsuario)}&fecha=gte.${fechaInicio}&fecha=lte.${fechaFin}&select=*`;
                const resReg = await fetch(queryReg, { headers });
                
                if (resReg.ok) {
                    datosPreviewCache.registros = await resReg.json();
                } else {
                    console.error("Error en registro_diario:", await resReg.text());
                    datosPreviewCache.registros = [];
                }
                
                datosPreviewCache.activo = true;
                datosPreviewCache.rangoTexto = `👤 ${nombreUsuario} | 📅 ${fechaInicio} al ${fechaFin}`;

                $('infoBarraEstado').textContent = datosPreviewCache.rangoTexto;
                $('infoBarraEstado').classList.remove('hidden');

                cerrarModalPreview();
                redibujar();
                alert(`✅ Vista previa aplicada. Registros encontrados: ${datosPreviewCache.registros.length}`);
            } catch (e) {
                console.error("Excepción crítica al consultar la base de datos:", e);
                alert("❌ Error al consultar la base de datos.");
            }
        };

        async function renderPage(num) {
            const page = await pdfDoc.getPage(num);
            pageViewport = page.getViewport({ scale });
            const canvas = $('pdfCanvas');
            canvas.height = pageViewport.height; canvas.width = pageViewport.width;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: pageViewport }).promise;
            redibujar();
        }

        $('canvasContainer').onclick = (e) => {
            if (!pdfDoc || isDragging || e.target.classList.contains('caja-mapeada')) return;
            const r = $('pdfCanvas').getBoundingClientRect();
            const x = e.clientX - r.left, y = e.clientY - r.top;

            if (!primerPunto) {
                primerPunto = { x, y };
                $('estadoModo').textContent = `📍 Primer punto fijado para "${campoActivo}". Toca el segundo.`;
            } else {
                const x1 = Math.min(primerPunto.x, x) / scale, x2 = Math.max(primerPunto.x, x) / scale;
                const y1 = (pageViewport.height - Math.max(primerPunto.y, y)) / scale;
                const y2 = (pageViewport.height - Math.min(primerPunto.y, y)) / scale;

                if ((x2 - x1) > 3 && (y2 - y1) > 3) {
                    const previo = coordenadasMap[campoActivo] || {};
                    coordenadasMap[campoActivo] = { 
                        x1: +x1.toFixed(1), 
                        y1: +y1.toFixed(1), 
                        x2: +x2.toFixed(1), 
                        y2: +y2.toFixed(1),
                        tipo: previo.tipo || 'libre',
                        usuario_col: previo.usuario_col || (columnasUsuariosCache[0] || 'nombre')
                    };
                    normalizarOrdenMapa();
                    campoActivo = sigCampo();
                    actualizarSelects();
                    redibujar();
                }
                primerPunto = null;
                $('estadoModo').textContent = `📌 Listo. Mapeando: "${campoActivo}". Toca 2 puntos o arrastra cajas.`;
            }
        };

        window.iniciarArrastre = (e, k) => {
            e.stopPropagation();
            isDragging = true;
            dragCampo = k;
            window.selCampo(k);
            const r = $('pdfCanvas').getBoundingClientRect();
            startX = e.clientX - r.left;
            startY = e.clientY - r.top;
        };

        window.addEventListener('pointermove', (e) => {
            if (!isDragging || !dragCampo) return;
            const r = $('pdfCanvas').getBoundingClientRect();
            const currentX = e.clientX - r.left;
            const currentY = e.clientY - r.top;

            const dx = (currentX - startX) / scale;
            const dy = -(currentY - startY) / scale;

            startX = currentX;
            startY = currentY;

            const b = coordenadasMap[dragCampo];
            if (b) {
                b.x1 = +(b.x1 + dx).toFixed(1);
                b.x2 = +(b.x2 + dx).toFixed(1);
                b.y1 = +(b.y1 + dy).toFixed(1);
                b.y2 = +(b.y2 + dy).toFixed(1);
                actualizarUI();
                redibujar();
            }
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
            dragCampo = null;
        });

        window.mover = (dx, dy) => {
            if (!coordenadasMap[campoActivo]) return;
            const b = coordenadasMap[campoActivo];
            b.x1 += dx; b.x2 += dx; b.y1 += dy; b.y2 += dy;
            actualizarUI(); redibujar();
        };

        window.redimensionar = (dw, dh) => {
            if (!coordenadasMap[campoActivo]) return;
            const b = coordenadasMap[campoActivo];
            b.x2 = +(b.x2 + dw).toFixed(1);
            b.y2 = +(b.y2 + dh).toFixed(1);
            actualizarUI(); redibujar();
        };

        window.cambiarTipoCampo = async (k, selectEl) => {
            const valor = selectEl.value;
            if (!coordenadasMap[k]) return;

            if (valor === 'fijo') {
                coordenadasMap[k].tipo = 'fijo';
                await obtenerColumnasUsuariosEnVivo();
                if (!coordenadasMap[k].usuario_col) {
                    coordenadasMap[k].usuario_col = columnasUsuariosCache[0] || 'nombre';
                }
                actualizarUI();
                redibujar();
            } else if (['montag', 'dienstag', 'mittwoch', 'donnerstag', 'freitag'].includes(valor)) {
                let nombreDestino = valor;
                if (coordenadasMap[nombreDestino] && nombreDestino !== k) {
                    nombreDestino = `${valor}_${Date.now().toString().slice(-3)}`;
                }
                
                const datos = coordenadasMap[k];
                datos.tipo = 'dinamico';
                delete coordenadasMap[k];
                coordenadasMap[nombreDestino] = datos;

                normalizarOrdenMapa();
                if (campoActivo === k) campoActivo = nombreDestino;

                actualizarSelects();
                redibujar();
            } else {
                coordenadasMap[k].tipo = 'libre';
                actualizarUI();
                redibujar();
            }
        };

        window.actualizarColumnaUsuario = (k, selectEl) => {
            if (coordenadasMap[k]) {
                coordenadasMap[k].usuario_col = selectEl.value;
                actualizarUI();
            }
        };

        window.abrirModalDuplicar = (k) => {
            if (!coordenadasMap[k]) return;
            campoPendienteDuplicar = k;
            $('lblCampoOrigen').textContent = k;
            $('inputNuevoNombreDuplicado').value = sigCampo();$('duplicateModal').classList.remove('hidden');
        };

        window.cerrarModalDuplicar = () => { $('duplicateModal').classList.add('hidden'); };

        window.confirmarDuplicar = () => {
            const nuevoNombre = $('inputNuevoNombreDuplicado').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_');
            if (!nuevoNombre) return alert("Escribe un nombre válido.");
            if (coordenadasMap[nuevoNombre]) return alert("Este nombre de campo ya existe.");

            const bOrig = coordenadasMap[campoPendienteDuplicar];
            const offset = 15 / scale;
            coordenadasMap[nuevoNombre] = {
                x1: +(bOrig.x1 + offset).toFixed(1),
                y1: bOrig.y1,
                x2: +(bOrig.x2 + offset).toFixed(1),
                y2: bOrig.y2,
                tipo: bOrig.tipo || 'libre',
                usuario_col: bOrig.usuario_col || (columnasUsuariosCache[0] || 'nombre')
            };

            normalizarOrdenMapa();
            campoActivo = nuevoNombre;
            actualizarSelects();
            redibujar();
            cerrarModalDuplicar();
        };

        function actualizarSelects() {
            normalizarOrdenMapa();
            const keys = obtenerKeysOrdenadas(coordenadasMap);
            if (!keys.includes(campoActivo) && keys.length) campoActivo = keys[keys.length - 1];
            if (!keys.length) campoActivo = 'campo_1';
            
            const allOpts = [...new Set([...keys, campoActivo, sigCampo()])];
            $('campoSelect').innerHTML = allOpts.map(k => `<option value="${k}" ${k === campoActivo ? 'selected' : ''}>${k}</option>`).join('');
            actualizarUI();
        }

        $('campoSelect').onchange = (e) => {
            campoActivo = e.target.value;
            primerPunto = null;
            actualizarUI(); redibujar();
        };

        function actualizarUI() {
            normalizarOrdenMapa();
            $('jsonOutput').value = JSON.stringify(coordenadasMap, null, 2);
            
            const keysOrdenadas = obtenerKeysOrdenadas(coordenadasMap);
            $('listaCoordenadas').innerHTML = keysOrdenadas.map(k => {
                const b = coordenadasMap[k];
                const esActivo = k === campoActivo;
                const tipoActual = b.tipo || 'libre';
                const colSeleccionada = b.usuario_col || (columnasUsuariosCache[0] || 'nombre');

                const optionsUsuariosHTML = columnasUsuariosCache.map(col => `<option value="${col}" ${col === colSeleccionada ? 'selected' : ''}>usuarios.${col}</option>`).join('');

                return `
                    <div class="p-2 rounded border space-y-1.5 ${esActivo ? 'bg-indigo-50 border-indigo-500 ring-1 ring-indigo-500' : 'bg-white'}" onclick="window.selCampo('${k}')">
                        <div class="flex justify-between items-center gap-1">
                            <span class="font-bold text-indigo-900 truncate" title="${k}">${k}</span>
                            <div class="flex items-center space-x-1 shrink-0">
                                <button onclick="event.stopPropagation(); window.abrirModalDuplicar('${k}')" class="text-blue-600 font-bold px-1" title="Duplicar">📋</button>
                                <button onclick="event.stopPropagation(); window.delCampo('${k}')" class="text-red-600 font-bold px-1" title="Eliminar">🗑️</button>
                            </div>
                        </div>

                        <div class="flex space-x-1" onclick="event.stopPropagation()">
                            <select class="w-full p-1 border rounded bg-gray-50 text-[10px] font-semibold text-gray-700" onchange="window.cambiarTipoCampo('${k}', this)">
                                <option value="" ${tipoActual === 'libre' && !['montag','dienstag','mittwoch','donnerstag','freitag'].includes(k) ? 'selected' : ''}>-- Asignar rol / día opcional --</option>
                                <option value="montag" ${k === 'montag' || tipoActual === 'montag' ? 'selected' : ''}>📅 Montag (Lunes)</option>
                                <option value="dienstag" ${k === 'dienstag' || tipoActual === 'dienstag' ? 'selected' : ''}>📅 Dienstag (Martes)</option>
                                <option value="mittwoch" ${k === 'mittwoch' || tipoActual === 'mittwoch' ? 'selected' : ''}>📅 Mittwoch (Miércoles)</option>
                                <option value="donnerstag" ${k === 'donnerstag' || tipoActual === 'donnerstag' ? 'selected' : ''}>📅 Donnerstag (Jueves)</option>
                                <option value="freitag" ${k === 'freitag' || tipoActual === 'freitag' ? 'selected' : ''}>📅 Freitag (Viernes)</option>
                                <option value="fijo" ${tipoActual === 'fijo' ? 'selected' : ''}>📌 Campo Fijo (Usuarios)</option>
                            </select>
                        </div>

                        ${tipoActual === 'fijo' ? `
                            <div class="pt-0.5" onclick="event.stopPropagation()">
                                <select class="w-full p-1 border border-amber-300 rounded bg-amber-50 text-[10px] font-semibold text-amber-900 focus:outline-none" onchange="window.actualizarColumnaUsuario('${k}', this)">
                                    ${optionsUsuariosHTML}
                                </select>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('') || '<p class="text-gray-400 text-center mt-10">Sin coordenadas aún.</p>';
        }

        window.selCampo = (k) => { campoActivo = k; $('campoSelect').value = k; primerPunto = null; actualizarUI(); redibujar(); };
        window.delCampo = (k) => { delete coordenadasMap[k]; actualizarSelects(); redibujar(); };

        function redibujar() {
            if (!pageViewport) return;
            $('drawingOverlay').innerHTML = Object.entries(coordenadasMap).map(([k, b]) => {
                const l = b.x1 * scale, t = pageViewport.height - (b.y2 * scale);
                const w = (b.x2 - b.x1) * scale, h = (b.y2 - b.y1) * scale;
                const activo = k === campoActivo;
                const tipoActual = b.tipo || 'libre';

                let textoMostrado = k;
                let etiquetaFija = tipoActual === 'fijo' && b.usuario_col ? ` [usuarios.${b.usuario_col}]` : '';

                if (datosPreviewCache.activo) {
                    if (tipoActual === 'fijo' && b.usuario_col) {
                        textoMostrado = datosPreviewCache.usuario[b.usuario_col] !== undefined ? String(datosPreviewCache.usuario[b.usuario_col]) : '';
                        etiquetaFija = '';
                    } else {
                        const diasMapeo = { 'montag': 'Monday', 'dienstag': 'Tuesday', 'mittwoch': 'Wednesday', 'donnerstag': 'Thursday', 'freitag': 'Friday' };
                        // Validar si la clave o el tipo corresponde a un día de la semana
                        const diaTargetIngles = diasMapeo[k] || diasMapeo[tipoActual];

                        if (diaTargetIngles) {
                            const registrosDelDia = datosPreviewCache.registros.filter(r => {
                                if (!r.dia_semana) return false;
                                return r.dia_semana.trim().toLowerCase() === diaTargetIngles.toLowerCase();
                            });
                            textoMostrado = registrosDelDia.length > 0 ? registrosDelDia.map(r => r.nombre_actividad || r.actividad || '').filter(Boolean).join(' • ') : '';
                        } else {
                            textoMostrado = '';
                        }
                        etiquetaFija = '';
                    }
                }

                let estiloColor = 'border-indigo-600 bg-indigo-500/20 text-indigo-900';
                if (tipoActual === 'fijo') estiloColor = 'border-amber-600 bg-amber-500/20 text-amber-900';
                if (['montag','dienstag','mittwoch','donnerstag','freitag'].includes(k) || ['montag','dienstag','mittwoch','donnerstag','freitag'].includes(tipoActual)) {
                    estiloColor = 'border-emerald-600 bg-emerald-500/20 text-emerald-900';
                }

                return `<div class="caja-mapeada absolute rounded text-[9px] font-bold px-1 flex items-center justify-between pointer-events-auto overflow-hidden ${activo ? 'border-2 border-red-500 bg-red-500/30 text-red-900 z-20' : 'border ' + estiloColor + ' z-10'}" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;" onpointerdown="window.iniciarArrastre(event, '${k}')">
                    <span class="truncate">${textoMostrado}${etiquetaFija}</span>
                    ${!datosPreviewCache.activo && tipoActual === 'fijo' ? '<span class="text-[8px] shrink-0 ml-1" title="Campo Fijo DB">📌</span>' : ''}
                </div>`;
            }).join('');
        }

        $('btnGuardar').onclick = async () => {
            const name = escuelaCargada ? escuelaCargada.school_name : prompt("Nombre de la escuela:");
            if (!name) return;
            const id = name.toLowerCase().replace(/[^a-z0-9]/g, '_') + '_v1';
            
            normalizarOrdenMapa();

            const res = await fetch(`${SUPABASE_URL}/rest/v1/school_templates?on_conflict=file_identifier`, {
                method: 'POST',
                headers: { ...headers, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
                body: JSON.stringify({ school_name: name, file_identifier: id, pdf_filename: 'template.pdf', coordinates_json: coordenadasMap })
            });
            if (res.ok) { alert("✅ Guardado con éxito."); cargarPlantillas(); }
