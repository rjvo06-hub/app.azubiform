<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapeador Visual Mobile - Azubiform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        .resize-handle {
            position: absolute;
            background: #ffffff;
            border: 1.5px solid #dc2626;
            width: 6px;
            height: 6px;
            z-index: 60;
            touch-action: none;
        }
        .handle-nw { top: -3px; left: -3px; }
        .handle-ne { top: -3px; right: -3px; }
        .handle-se { bottom: -3px; right: -3px; }
        .handle-sw { bottom: -3px; left: -3px; }
        .handle-n  { top: -3px; left: 50%; transform: translateX(-50%); }
        .handle-s  { bottom: -3px; left: 50%; transform: translateX(-50%); }
        .handle-w  { top: 50%; left: -3px; transform: translateY(-50%); }
        .handle-e  { top: 50%; right: -3px; transform: translateY(-50%); }
        
        .caja-mapeada {
            touch-action: none;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-3 sm:p-6">

    <div class="max-w-7xl mx-auto space-y-4">
        <!-- Cabecera -->
        <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3">
            <h1 class="text-xs sm:text-sm font-bold text-indigo-900 uppercase text-center sm:text-left">📱 Mapeador Visual FOS (Carga & Edición)</h1>
            <div class="flex items-center space-x-2 w-full sm:w-auto justify-between">
                <input type="file" id="pdfFile" accept="application/pdf" class="text-[11px] text-gray-500 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[11px] file:font-semibold file:bg-indigo-50 file:text-indigo-700">
                <button id="btnGuardarSupabase" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-2 rounded-lg shadow transition whitespace-nowrap">💾 Guardar</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <!-- Panel Izquierdo: Lienzo del PDF -->
            <div class="lg:col-span-2 bg-gray-900 rounded-xl p-2 sm:p-4 flex justify-center overflow-auto max-h-[60vh] lg:max-h-[800px] relative border border-gray-300">
                <div class="relative inline-block cursor-crosshair" id="canvasContainer">
                    <canvas id="pdfCanvas" class="block shadow-lg max-w-full"></canvas>
                    <div id="drawingOverlay" class="absolute inset-0 pointer-events-none"></div>
                </div>
            </div>

            <!-- Panel Derecho: Gestión de Campos y Controles -->
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm space-y-3 flex flex-col">
                <h2 class="text-xs font-bold text-gray-800 uppercase border-b pb-2">Configuración de Campos</h2>
                
                <div class="space-y-2">
                    <!-- Cargar Plantilla Existente desde Supabase -->
                    <div class="bg-indigo-50 p-2 rounded-lg border border-indigo-200 space-y-1">
                        <label class="text-[10px] font-semibold text-indigo-900">📂 Cargar plantilla guardada:</label>
                        <div class="flex space-x-1">
                            <select id="selectPlantillasGuardadas" class="w-full p-1 border border-indigo-300 rounded text-xs bg-white">
                                <option value="">-- Selecciona una escuela --</option>
                            </select>
                            <button id="btnCargarPlantilla" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-2.5 py-1 rounded">📥 Cargar</button>
                        </div>
                    </div>

                    <div>
                        <label class="text-[11px] font-semibold text-gray-700">Seleccionar Campo:</label>
                        <select id="campoSelect" class="w-full p-2 border border-gray-300 rounded-lg text-xs bg-white focus:ring-2 focus:ring-indigo-500 mt-1">
                            <option value="schueler">Schüler / Schülerin</option>
                            <option value="klasse">Klasse</option>
                            <option value="wochenbericht_nr">Wochenbericht Nr.</option>
                            <option value="betreuende_lehrkraft">Betreuende Lehrkraft</option>
                            <option value="ausbildungsrichtung">Ausbildungsrichtung</option>
                            <option value="ausbildungsstaette">Ausbildungsstätte</option>
                            <option value="montag">Montag</option>
                            <option value="dienstag">Dienstag</option>
                            <option value="mittwoch">Mittwoch</option>
                            <option value="donnerstag">Donnerstag</option>
                            <option value="freitag">Freitag</option>
                            <option value="montag_stunden">Montag - Stunden</option>
                            <option value="dienstag_stunden">Dienstag - Stunden</option>
                            <option value="mittwoch_stunden">Mittwoch - Stunden</option>
                            <option value="donnerstag_stunden">Donnerstag - Stunden</option>
                            <option value="freitag_stunden">Freitag - Stunden</option>
                            <option value="gesamtstunden">Gesamtstunden (Total)</option>
                        </select>
                    </div>

                    <!-- Añadir campo personalizado -->
                    <div class="bg-gray-50 p-2 rounded-lg border border-gray-200 space-y-1">
                        <label class="text-[10px] font-semibold text-gray-700">Añadir campo nuevo (si se te olvidó):</label>
                        <div class="flex space-x-1">
                            <input type="text" id="nuevoCampoInput" placeholder="Nombre..." class="w-full p-1 border border-gray-300 rounded text-xs bg-white">
                            <button id="btnAgregarCampo" class="bg-emerald-600 text-white text-xs px-2.5 py-1 rounded">➕</button>
                        </div>
                    </div>

                    <div id="estadoModo" class="text-[11px] font-bold text-indigo-600 bg-indigo-50 p-2 rounded border border-indigo-200 text-center">
                        📌 Toca dos puntos en el PDF para crear la caja.
                    </div>

                    <!-- Controles Táctiles de Movimiento -->
                    <div class="bg-slate-50 p-2 rounded-lg border border-slate-200 space-y-1">
                        <label class="text-[10px] font-bold text-slate-700 uppercase block text-center">🕹️ Ajuste Fino Táctil (Campo Activo)</label>
                        <div class="grid grid-cols-3 gap-1 max-w-[160px] mx-auto">
                            <div></div>
                            <button id="btnMoverArriba" class="bg-slate-200 hover:bg-slate-300 py-1.5 rounded text-xs font-bold">⬆️</button>
                            <div></div>
                            <button id="btnMoverIzquierda" class="bg-slate-200 hover:bg-slate-300 py-1.5 rounded text-xs font-bold">⬅️</button>
                            <button id="btnMoverAbajo" class="bg-slate-200 hover:bg-slate-300 py-1.5 rounded text-xs font-bold">⬇️</button>
                            <button id="btnMoverDerecha" class="bg-slate-200 hover:bg-slate-300 py-1.5 rounded text-xs font-bold">➡️</button>
                        </div>
                    </div>
                </div>

                <!-- Lista de campos guardados -->
                <div class="h-32 overflow-y-auto border border-gray-200 rounded-lg p-2 space-y-2 bg-gray-50" id="listaCoordenadas">
                    <p class="text-[11px] text-gray-400 text-center mt-4">No hay coordenadas capturadas aún.</p>
                </div>

                <!-- JSON Exportado -->
                <div class="space-y-1">
                    <label class="text-[11px] font-semibold text-gray-700">JSON:</label>
                    <textarea id="jsonOutput" readonly class="w-full h-14 p-1.5 text-[9px] font-mono bg-gray-900 text-green-400 rounded-lg border border-gray-700 focus:outline-none"></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para duplicar -->
    <div id="duplicateModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white p-4 rounded-xl shadow-xl w-full max-w-sm space-y-3">
            <h3 class="text-xs font-bold text-indigo-900 uppercase">📋 Duplicar Campo</h3>
            <select id="modalCampoSelect" class="w-full p-2 border border-gray-300 rounded-lg text-xs bg-white">
            </select>
            <div class="flex justify-end space-x-2 pt-2">
                <button id="modalBtnCancelar" class="px-3 py-1.5 bg-gray-200 text-gray-700 text-xs font-bold rounded-lg">Cancelar</button>
                <button id="modalBtnConfirmar" class="px-3 py-1.5 bg-indigo-600 text-white text-xs font-bold rounded-lg">Duplicar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { SUPABASE_URL, headers } from './js/config.js';

        const fileInput = document.getElementById('pdfFile');
        const canvas = document.getElementById('pdfCanvas');
        const container = document.getElementById('canvasContainer');
        const drawingOverlay = document.getElementById('drawingOverlay');
        const campoSelect = document.getElementById('campoSelect');
        const nuevoCampoInput = document.getElementById('nuevoCampoInput');
        const btnAgregarCampo = document.getElementById('btnAgregarCampo');
        const selectPlantillasGuardadas = document.getElementById('selectPlantillasGuardadas');
        const btnCargarPlantilla = document.getElementById('btnCargarPlantilla');
        const estadoModo = document.getElementById('estadoModo');
        const listaCoordenadas = document.getElementById('listaCoordenadas');
        const jsonOutput = document.getElementById('jsonOutput');
        const btnGuardar = document.getElementById('btnGuardarSupabase');
        
        const duplicateModal = document.getElementById('duplicateModal');
        const modalCampoSelect = document.getElementById('modalCampoSelect');
        const modalBtnCancelar = document.getElementById('modalBtnCancelar');
        const modalBtnConfirmar = document.getElementById('modalBtnConfirmar');

        let pdfDoc = null;
        let pageViewport = null;
        let scale = 1.2;
        let coordenadasMap = {};
        let campoSeleccionadoActivo = null;
        let campoPendienteDuplicar = null;
        
        let escuelaActualCargada = null;
        
        let primerPunto = null; 
        let isResizing = false;
        let isMoving = false;
        let resizeHandleType = null;
        let startX = 0, startY = 0;

        function inicializarModalSelect() {
            modalCampoSelect.innerHTML = campoSelect.innerHTML;
        }
        inicializarModalSelect();

        async function cargarListaPlantillas() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/school_templates?select=school_name,file_identifier`, {
                    headers: { ...headers, 'Range': '0-999' }
                });
                if (response.ok) {
                    const data = await response.json();
                    selectPlantillasGuardadas.innerHTML = '<option value="">-- Selecciona una escuela --</option>';
                    data.forEach(item => {
                        const opt = document.createElement('option');
                        opt.value = item.file_identifier;
                        opt.textContent = item.school_name;
                        selectPlantillasGuardadas.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error("Error al obtener plantillas:", err);
            }
        }
        cargarListaPlantillas();

        btnCargarPlantilla.addEventListener('click', async () => {
            const fileIdentifier = selectPlantillasGuardadas.value;
            if (!fileIdentifier) {
                alert("⚠️ Selecciona una escuela primero.");
                return;
            }

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/school_templates?file_identifier=eq.${encodeURIComponent(fileIdentifier)}&select=school_name,file_identifier,coordinates_json`, {
                    headers: { ...headers, 'Range': '0-999' }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.length > 0 && data[0].coordinates_json) {
                        coordenadasMap = data[0].coordinates_json;
                        escuelaActualCargada = {
                            school_name: data[0].school_name,
                            file_identifier: data[0].file_identifier
                        };

                        for (const campo of Object.keys(coordenadasMap)) {
                            const existe = Array.from(campoSelect.options).some(opt => opt.value === campo);
                            if (!existe) {
                                const opt = document.createElement('option');
                                opt.value = campo;
                                opt.textContent = `${campo} (Cargado)`;
                                campoSelect.appendChild(opt);

                                const optModal = document.createElement('option');
                                optModal.value = campo;
                                optModal.textContent = `${campo} (Cargado)`;
                                modalCampoSelect.appendChild(optModal);
                            }
                        }

                        actualizarUI();
                        if (pdfDoc) redibujarTodasLasCajas();
                        alert(`✅ Plantilla de "${escuelaActualCargada.school_name}" cargada con éxito.`);
                    } else {
                        alert("⚠️ No se encontraron coordenadas para esta plantilla.");
                    }
                } else {
                    const errText = await response.text();
                    alert("❌ Error del servidor Supabase: " + errText);
                }
            } catch (err) {
                console.error(err);
                alert("❌ Error de red al conectar con Supabase para cargar.");
            }
        });

        btnAgregarCampo.addEventListener('click', () => {
            const val = nuevoCampoInput.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_');
            if (!val) return alert("Escribe un nombre válido.");

            const existe = Array.from(campoSelect.options).some(opt => opt.value === val);
            if (existe) return alert("Este campo ya existe.");

            const opt = document.createElement('option');
            opt.value = val;
            opt.textContent = `${val} (Personalizado)`;
            campoSelect.appendChild(opt);

            const optModal = document.createElement('option');
            optModal.value = val;
            optModal.textContent = `${val} (Personalizado)`;
            modalCampoSelect.appendChild(optModal);

            campoSelect.value = val;
            primerPunto = null;
            estadoModo.textContent = `📌 Campo "${val}" añadido. Toca dos puntos.`;
            nuevoCampoInput.value = '';
        });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const fileReader = new FileReader();
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                const loadingTask = pdfjsLib.getDocument(typedarray);
                pdfDoc = await loadingTask.promise;
                renderPage(1);
            };
            fileReader.readAsArrayBuffer(file);
        });

        async function renderPage(num) {
            const page = await pdfDoc.getPage(num);
            pageViewport = page.getViewport({ scale });

            const context = canvas.getContext('2d');
            canvas.height = pageViewport.height;
            canvas.width = pageViewport.width;

            await page.render({ canvasContext: context, viewport: pageViewport }).promise;
            redibujarTodasLasCajas();
        }

        container.addEventListener('click', (e) => {
            if (!pdfDoc) return;
            if (isResizing || isMoving) return;

            if (e.target.classList.contains('caja-mapeada') || e.target.classList.contains('resize-handle')) {
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            if (!primerPunto) {
                primerPunto = { x: clickX, y: clickY };
                estadoModo.textContent = `📍 Primer punto fijado. Toca el segundo punto para "${campoSelect.value}".`;
            } else {
                const segundoPunto = { x: clickX, y: clickY };

                const canvasX1 = Math.min(primerPunto.x, segundoPunto.x);
                const canvasX2 = Math.max(primerPunto.x, segundoPunto.x);
                const canvasY1 = Math.min(primerPunto.y, segundoPunto.y);
                const canvasY2 = Math.max(primerPunto.y, segundoPunto.y);

                if ((canvasX2 - canvasX1) > 5 && (canvasY2 - canvasY1) > 5) {
                    const pdfX1 = canvasX1 / scale;
                    const pdfX2 = canvasX2 / scale;
                    const pdfY1 = (pageViewport.height - canvasY2) / scale;
                    const pdfY2 = (pageViewport.height - canvasY1) / scale;

                    const campoActual = campoSelect.value;
                    coordenadasMap[campoActual] = {
                        x1: Math.round(pdfX1 * 10) / 10,
                        y1: Math.round(pdfY1 * 10) / 10,
                        x2: Math.round(pdfX2 * 10) / 10,
                        y2: Math.round(pdfY2 * 10) / 10
                    };

                    campoSeleccionadoActivo = campoActual;
                    actualizarUI();
                    redibujarTodasLasCajas();
                }

                primerPunto = null;
                estadoModo.textContent = `📌 Toca dos puntos en el PDF para crear la caja.`;
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!isResizing && !isMoving) return;

            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            if (isResizing && campoSeleccionadoActivo) {
                const box = coordenadasMap[campoSeleccionadoActivo];
                if (!box) return;

                let canvasX1 = box.x1 * scale;
                let canvasX2 = box.x2 * scale;
                let canvasY1 = pageViewport.height - (box.y2 * scale);
                let canvasY2 = pageViewport.height - (box.y1 * scale);

                const dx = currentX - startX;
                const dy = currentY - startY;
                startX = currentX;
                startY = currentY;

                if (resizeHandleType.includes('w')) canvasX1 += dx;
                if (resizeHandleType.includes('e')) canvasX2 += dx;
                if (resizeHandleType.includes('n')) canvasY1 += dy;
                if (resizeHandleType.includes('s')) canvasY2 += dy;

                box.x1 = Math.round((Math.min(canvasX1, canvasX2) / scale) * 10) / 10;
                box.x2 = Math.round((Math.max(canvasX1, canvasX2) / scale) * 10) / 10;
                box.y1 = Math.round(((pageViewport.height - Math.max(canvasY1, canvasY2)) / scale) * 10) / 10;
                box.y2 = Math.round(((pageViewport.height - Math.min(canvasY1, canvasY2)) / scale) * 10) / 10;

                actualizarUI();
                redibujarTodasLasCajas();
            } else if (isMoving && campoSeleccionadoActivo) {
                const box = coordenadasMap[campoSeleccionadoActivo];
                if (!box) return;

                const dx = currentX - startX;
                const dy = currentY - startY;
                startX = currentX;
                startY = currentY;

                const deltaPdfX = dx / scale;
                const deltaPdfY = -dy / scale;

                box.x1 = Math.round((box.x1 + deltaPdfX) * 10) / 10;
                box.x2 = Math.round((box.x2 + deltaPdfX) * 10) / 10;
                box.y1 = Math.round((box.y1 + deltaPdfY) * 10) / 10;
                box.y2 = Math.round((box.y2 + deltaPdfY) * 10) / 10;

                actualizarUI();
                redibujarTodasLasCajas();
            }
        });

        window.addEventListener('pointerup', () => {
            isResizing = false;
            isMoving = false;
            resizeHandleType = null;
        });

        function moverActivo(dx, dy) {
            if (!campoSeleccionadoActivo || !coordenadasMap[campoSeleccionadoActivo]) return;
            const box = coordenadasMap[campoSeleccionadoActivo];
            box.x1 += dx; box.x2 += dx;
            box.y1 += dy; box.y2 += dy;
            actualizarUI();
            redibujarTodasLasCajas();
        }

        document.getElementById('btnMoverArriba').onclick = () => moverActivo(0, 1);
        document.getElementById('btnMoverAbajo').onclick = () => moverActivo(0, -1);
        document.getElementById('btnMoverIzquierda').onclick = () => moverActivo(-1, 0);
        document.getElementById('btnMoverDerecha').onclick = () => moverActivo(1, 0);

        window.abrirModalDuplicar = function(campoOriginal) {
            if (!coordenadasMap[campoOriginal]) return;
            campoPendienteDuplicar = campoOriginal;
            duplicateModal.classList.remove('hidden');
        };

        modalBtnCancelar.onclick = () => duplicateModal.classList.add('hidden');
        modalBtnConfirmar.onclick = () => {
            const campoDestino = modalCampoSelect.value;
            const boxOriginal = coordenadasMap[campoPendienteDuplicar];
            if (boxOriginal && campoDestino) {
                const offset = 15 / scale;
                coordenadasMap[campoDestino] = {
                    x1: Math.round((boxOriginal.x1 + offset) * 10) / 10,
                    y1: boxOriginal.y1,
                    x2: Math.round((boxOriginal.x2 + offset) * 10) / 10,
                    y2: boxOriginal.y2
                };
                campoSeleccionadoActivo = campoDestino;
                actualizarUI();
                redibujarTodasLasCajas();
            }
            duplicateModal.classList.add('hidden');
        };

        function actualizarUI() {
            listaCoordenadas.innerHTML = '';
            jsonOutput.value = JSON.stringify(coordenadasMap, null, 2);

            for (const [campo, box] of Object.entries(coordenadasMap)) {
                const item = document.createElement('div');
                const esActivo = campo === campoSeleccionadoActivo;
                item.className = `p-2 rounded border text-xs flex justify-between items-center cursor-pointer transition ${esActivo ? 'bg-indigo-50 border-indigo-500 ring-1 ring-indigo-500' : 'bg-white border-gray-200'}`;
                
                item.onclick = () => {
                    campoSeleccionadoActivo = campo;
                    actualizarUI();
                    redibujarTodasLasCajas();
                };

                item.innerHTML = `
                    <div>
                        <span class="font-bold text-indigo-900">${campo} ${esActivo ? '⚡' : ''}</span>
                        <div class="text-[9px] text-gray-500 font-mono">x1:${box.x1}, y1:${box.y1}</div>
                    </div>
                    <div class="flex items-center space-x-1">
                        <button class="text-blue-600 font-bold px-1.5 py-1 text-xs" onclick="event.stopPropagation(); window.abrirModalDuplicar('${campo}')">📋</button>
                        <button class="text-red-600 font-bold px-1.5 py-1 text-xs" onclick="event.stopPropagation(); window.eliminarCampo('${campo}')">🗑️</button>
                    </div>
                `;
                listaCoordenadas.appendChild(item);
            }
        }

        function redibujarTodasLasCajas() {
            if (!pageViewport) return;
            drawingOverlay.innerHTML = '';
            for (const [campo, box] of Object.entries(coordenadasMap)) {
                const left = box.x1 * scale;
                const top = pageViewport.height - (box.y2 * scale);
                const width = (box.x2 - box.x1) * scale;
                const height = (box.y2 - box.y1) * scale;

                const cajaVisual = document.createElement('div');
                const esActivo = campo === campoSeleccionadoActivo;
                
                cajaVisual.className = `caja-mapeada absolute rounded text-[9px] font-bold px-1 flex items-center justify-between transition ${esActivo ? 'border-2 border-red-500 bg-red-500/30 text-red-900 ring-2 ring-red-400 z-20' : 'border border-indigo-600 bg-indigo-500/20 text-indigo-900 z-10'}`;
                cajaVisual.style.left = `${left}px`;
                cajaVisual.style.top = `${top}px`;
                cajaVisual.style.width = `${width}px`;
                cajaVisual.style.height = `${height}px`;
                cajaVisual.style.pointerEvents = 'auto';
                cajaVisual.textContent = campo;

                cajaVisual.onpointerdown = (e) => {
                    e.stopPropagation();
                    campoSeleccionadoActivo = campo;
                    actualizarUI();
                    redibujarTodasLasCajas();

                    isMoving = true;
                    const rect = canvas.getBoundingClientRect();
                    startX = e.clientX - rect.left;
                    startY = e.clientY - rect.top;
                };

                if (esActivo) {
                    const handles = ['nw', 'ne', 'se', 'sw', 'n', 's', 'w', 'e'];
                    handles.forEach(h => {
                        const handle = document.createElement('div');
                        handle.className = `resize-handle handle-${h}`;
                        handle.onpointerdown = (ev) => {
                            ev.stopPropagation();
                            isResizing = true;
                            resizeHandleType = h;
                            const rect = canvas.getBoundingClientRect();
                            startX = ev.clientX - rect.left;
                            startY = ev.clientY - rect.top;
                        };
                        cajaVisual.appendChild(handle);
                    });
                }

                drawingOverlay.appendChild(cajaVisual);
            }
        }

        window.eliminarCampo = function(campo) {
            delete coordenadasMap[campo];
            if (campoSeleccionadoActivo === campo) campoSeleccionadoActivo = null;
            actualizarUI();
            redibujarTodasLasCajas();
        };

        btnGuardar.addEventListener('click', async () => {
            let schoolName, fileIdentifier;

            if (escuelaActualCargada) {
                schoolName = escuelaActualCargada.school_name;
                fileIdentifier = escuelaActualCargada.file_identifier;
            } else {
                schoolName = prompt("Nombre de la escuela:");
                if (!schoolName) return;
                fileIdentifier = schoolName.toLowerCase().replace(/[^a-z0-9]/g, '_') + '_v1';
            }

            const pdfFilename = fileInput.files[0] ? fileInput.files[0].name : 'template.pdf';

            try {
                // Añadimos on_conflict a la URL para que Supabase actualice si ya existe la clave
                const response = await fetch(`${SUPABASE_URL}/rest/v1/school_templates?on_conflict=file_identifier`, {
                    method: 'POST',
                    headers: { 
                        ...headers, 
                        'Content-Type': 'application/json', 
                        'Prefer': 'resolution=merge-duplicates' 
                    },
                    body: JSON.stringify({
                        school_name: schoolName,
                        file_identifier: fileIdentifier,
                        pdf_filename: pdfFilename,
                        coordinates_json: coordenadasMap
                    })
                });

                if (response.ok) {
                    alert(`✅ ¡Plantilla de "${schoolName}" actualizada y guardada con éxito en Supabase!`);
                    cargarListaPlantillas();
                } else {
                    const err = await response.text();
                    alert("❌ Error: " + err);
                }
            } catch (err) {
                console.error(err);
                alert("❌ Error de red.");
            }
        });
    </script>
</body>
</html>
